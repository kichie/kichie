name: language card

on:
  schedule:
    # 毎週月曜 JST 6:00（日曜 UTC 21:00）
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: SVG を作る
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node scripts/generate-language-card.mjs

      - name: 変わっていたらコミットする
        run: |
          if git diff --quiet -- assets/languages.svg; then
            echo "変化なし"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/languages.svg
          git commit -m 'chore: 言語の内訳を更新する'
          git push
